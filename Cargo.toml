[package]
name = "hm_cx"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"  # or "rocket" if you prefer that framework
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.9"
once_cell = "1.18"
tokio = { version = "1", features = ["sync", "macros"] }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
